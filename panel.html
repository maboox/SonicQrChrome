<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SonicQR · Voice meets text</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="shell">
  <header><div class="brand"><img src="assets/icon.png" alt=""><div><strong dir="ltr">SonicQR<span class="version">0.4</span></strong><small data-i18n="tagline"></small></div></div><button id="language" class="quiet language" aria-label="Switch language"><i data-lucide="globe"></i><span id="languageLabel">EN</span></button></header>
  <section class="hero" aria-labelledby="heroTitle"><div class="eyebrow"><span class="live-dot"></span><span data-i18n="localBadge"></span></div><h1 id="heroTitle" data-i18n="heroTitle"></h1><p data-i18n="heroTip"></p><div class="soundwave" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div></section>
  <section class="target card" aria-labelledby="targetLabel"><div class="target-heading"><span class="eyebrow" id="targetLabel" data-i18n="target"></span><button id="refreshTarget" class="icon-button" data-i18n-title="refresh"><i data-lucide="refresh-cw"></i></button></div><strong id="targetName"></strong><p id="targetUrl" class="url" dir="ltr"></p></section>
  <nav class="tabs" role="tablist" aria-label="SonicQR"><button id="sendTab" role="tab" aria-selected="true" aria-controls="sendPanel" class="selected"><i data-lucide="send"></i><span data-i18n="send"></span></button><button id="receiveTab" role="tab" aria-selected="false" aria-controls="receivePanel" tabindex="-1"><i data-lucide="scan-line"></i><span data-i18n="receive"></span></button></nav>
  <main>
    <section id="sendPanel" role="tabpanel" aria-labelledby="sendTab">
      <div class="card compose"><div class="section-heading"><span class="step-number">01</span><h2 data-i18n="composeTitle"></h2></div>
        <label for="message" class="sr-only" data-i18n="message"></label><textarea id="message" rows="4" maxlength="1000" dir="auto" aria-describedby="count shortTip" placeholder="پیامت را بنویس…"></textarea><div class="meta"><span id="shortTip" data-i18n="shortTip"></span><span id="count"></span></div>
        <label for="profile" data-i18n="mode"></label><select id="profile" aria-describedby="profileHint"><option value="fast" data-i18n="fast"></option><option value="hidden" data-i18n="hidden"></option></select><p class="hint" id="profileHint"></p>
        <details class="settings"><summary><i data-lucide="settings-2"></i><span data-i18n="signalSettings"></span></summary><div class="two"><div><label for="strength" data-i18n="strength"></label><select id="strength"><option value="soft" data-i18n="soft"></option><option value="normal" selected data-i18n="normal"></option><option value="strong" data-i18n="strong"></option></select></div><div><label for="password" data-i18n="password"></label><input id="password" type="password" autocomplete="off" placeholder="اختیاری" aria-describedby="passwordTip"></div></div><p class="hint" id="passwordTip" data-i18n="passwordTip"></p></details>
        <button id="build" class="primary"><i data-lucide="wand-sparkles"></i><span id="buildLabel" data-i18n="build"></span></button>
        <div id="ready" class="signal-ready" hidden><div class="ready-line"><span class="dot"></span><strong data-i18n="ready"></strong><span id="duration"></span></div><audio id="preview" controls preload="metadata" aria-label="Signal preview"></audio><button id="saveSignal" class="secondary"><i data-lucide="download"></i><span data-i18n="saveSignal"></span></button></div>
      </div>
      <div class="card"><div class="section-heading"><span class="step-number">02</span><h2 data-i18n="mergeTitle"></h2></div><p class="hint" data-i18n="mergeTip"></p><button id="arm" class="primary" disabled><i data-lucide="radio"></i><span data-i18n="arm"></span></button><button id="disarm" class="danger" hidden><i data-lucide="x"></i><span data-i18n="disarm"></span></button><div id="mergeState" class="status" role="status"></div><progress id="mergeProgress" value="0" max="1" aria-label="Signal progress" hidden></progress><p id="holdTip" class="hint"></p><div id="manualStart" hidden><button id="startSignal" class="secondary" data-i18n="startSignal"></button><p class="hint" data-i18n="manualTip"></p></div><p class="hint" data-i18n="signalProof"></p>
        <details class="settings"><summary><i data-lucide="settings-2"></i><span data-i18n="diagnostics"></span></summary><p id="pathDetail" class="hint"></p><p id="mixDetail" class="hint"></p><button id="copyDiagnostics" class="secondary"><i data-lucide="copy"></i><span data-i18n="copyDiagnostics"></span></button></details>
      </div>
      <details class="card compatibility"><summary><i data-lucide="settings-2"></i><span data-i18n="compat"></span></summary><p class="hint" data-i18n="compatTip"></p><button id="enableSite" class="secondary" data-i18n="enableSite"></button><button id="disableSite" class="secondary" hidden data-i18n="disableSite"></button><p id="compatState" class="hint"></p></details>
    </section>
    <section id="receivePanel" role="tabpanel" aria-labelledby="receiveTab" hidden>
      <div class="card"><div class="section-heading"><i data-lucide="scan-line"></i><h2 data-i18n="readTitle"></h2></div><p class="hint" data-i18n="readTip"></p><label for="audioFile" class="file-picker"><i data-lucide="file-audio"></i><strong data-i18n="file"></strong><small data-i18n="fileLimits"></small><input id="audioFile" type="file" accept="audio/*,.wav,.webm,.ogg,.opus,.m4a,.mp3"></label><p id="filename" class="hint" dir="auto"></p><label for="decodePassword" data-i18n="decodePassword"></label><input id="decodePassword" type="password" autocomplete="off"><div class="divider"><span data-i18n="or"></span></div><button id="captureTab" class="secondary"><i data-lucide="audio-lines"></i><span data-i18n="captureTab"></span></button><p class="hint" data-i18n="captureTip"></p><button id="stopCapture" class="danger" hidden data-i18n="stopCapture"></button><span id="captureClock" class="clock" hidden></span></div>
      <div id="analysis" class="card" hidden><h2 data-i18n="analyzing"></h2><progress id="decodeProgress" value="0" max="1" aria-label="Audio analysis"></progress><button id="cancelDecode" class="secondary" data-i18n="cancel"></button></div>
      <div id="resultCard" class="card result-card" hidden><div class="ready-line"><i data-lucide="shield-check"></i><strong data-i18n="found"></strong></div><p id="resultText" class="result" dir="auto"></p><button id="copy" class="primary"><i data-lucide="copy"></i><span data-i18n="copy"></span></button></div><button id="retry" class="secondary" hidden data-i18n="retry"></button>
    </section>
    <div id="error" class="error" role="alert" hidden></div><div id="notice" class="notice" role="status" hidden></div>
    <div class="privacy-note"><i data-lucide="lock-keyhole"></i><p data-i18n="mixPrivacy"></p></div><button id="clearSession" class="text-button"><i data-lucide="eraser"></i><span data-i18n="clearSession"></span></button>
  </main>
  <footer><button id="demo" class="demo-link"><i data-lucide="flask-conical"></i><span data-i18n="demo"></span></button><details><summary><i data-lucide="circle-help"></i><span data-i18n="help"></span></summary><ol><li data-i18n="help1"></li><li data-i18n="help2"></li><li data-i18n="help3"></li><li data-i18n="help4"></li></ol><p class="hint" data-i18n="privacy"></p></details><a class="policy-link" href="privacy.html" target="_blank" rel="noopener" data-i18n="privacyLink"></a><p class="footer-brand" dir="ltr">SonicQR / made for your browser</p></footer>
</div><script src="panel.js" defer></script></body></html>
