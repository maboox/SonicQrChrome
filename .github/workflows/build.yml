name: Build Chrome extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonicqr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan reachable history for secrets
        shell: bash
        run: |
          scanner="$RUNNER_TEMP/sonicqr-gitleaks"
          mkdir -p "$scanner"
          curl --fail --silent --show-error --location --proto '=https' https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scanner/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$scanner/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner/gitleaks.tar.gz" -C "$scanner" gitleaks
          "$scanner/gitleaks" git . --redact --log-opts=--all --no-banner
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Build, validate and package release resources
        run: npm run package
      - name: Check committed runtime bundles match source
        run: git diff --exit-code -- panel.js demo.js mixer.js decoder.worker.js recorder.worklet.js
      - name: Unit tests
        run: npm test
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Audio and panel tests
        run: |
          npm run test:ui
          npm run test:recording
      - name: Installed Manifest V3 test
        env:
          SONICQR_EXTENSION_DIR: dist/extension
        run: npm run test:browser
      - name: Upload ready-to-submit ZIP directly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/*-webstore.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload checksums and build report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicqr-build-report
          path: |
            dist/SHA256SUMS.txt
            dist/build-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload test evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicqr-test-evidence
          path: qa/
          if-no-files-found: ignore
          retention-days: 7
