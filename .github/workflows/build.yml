name: Build Chrome extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonicqr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Build, validate and package release resources
        run: npm run package
      - name: Unit tests
        run: npm test
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Audio and panel tests
        run: |
          npm run test:ui
          npm run test:recording
      - name: Installed Manifest V3 test
        env:
          SONICQR_EXTENSION_DIR: dist/extension
        run: npm run test:browser
      - name: Upload ready-to-submit ZIP directly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/*-webstore.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload checksums and build report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicqr-build-report
          path: |
            dist/SHA256SUMS.txt
            dist/build-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload test evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonicqr-test-evidence
          path: qa/
          if-no-files-found: ignore
          retention-days: 7
