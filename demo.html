<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SonicQR · آزمایش ضبط</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell lab"><header><div class="brand"><img src="assets/icon.png" alt=""><div><strong dir="ltr">SonicQR</strong><small>Chrome · Beta 0.4.0</small></div></div><button id="language" class="quiet">EN</button></header><div class="hero"><h1 data-i18n="labTitle"></h1><p class="hint" data-i18n="labTip"></p></div><div class="card"><label for="message" data-i18n="message"></label><textarea id="message" rows="3">سلام! این اولین آزمایش SonicQR است.</textarea><div class="two"><div><label for="profile" data-i18n="mode"></label><select id="profile"><option value="fast" data-i18n="fast"></option><option value="hidden" data-i18n="hidden"></option></select></div><div><label for="password" data-i18n="password"></label><input id="password" type="password" autocomplete="off"></div></div><p class="hint" id="profileHint"></p><button id="record" class="primary" data-i18n="record"></button><button id="stop" class="danger" hidden data-i18n="stop"></button><div id="status" class="status" role="status"></div><progress id="progress" value="0" max="1" hidden></progress><p id="minimum" class="hint"></p><span id="clock" class="clock" hidden></span></div><div id="output" class="card" hidden><h2 data-i18n="readTitle"></h2><audio id="preview" controls></audio><button id="download" class="quiet" data-i18n="saveVoice"></button><p id="result" class="summary" dir="auto" hidden></p><label for="decodePassword" data-i18n="decodePassword"></label><input id="decodePassword" type="password"><button id="retry" class="primary" data-i18n="retry"></button></div><div id="error" class="error" role="alert" hidden></div><p class="hint" data-i18n="labLimit"></p><p class="hint" data-i18n="back"></p></div><script src="mixer.js" defer></script><script src="demo.js" defer></script></body></html>
